<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linen Storage - Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#f8f7f4}button{cursor:pointer}</style>
</head>
<body>
<script>
// >>> ISI URL WEB APP KAMU DI SINI, BIARKAN KOSONG JIKA MAU LOCAL SAJA <<<
const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwSf9mhBWcbX_kIuBe8tYE_kmsXyDOFSPqJkv_XDTX3Yq8CgWp_EqUdng_ls8H-L1lv7A/exec"; 
</script>

<div class="bg-slate-900 text-white">
  <div class="max-w-6xl mx-auto px-5 py-4 flex justify-between items-center">
    <b>LINEN STORAGE</b>
    <span id="badge" class="text-[10px] bg-white/20 px-3 py-1 rounded-full">LOCAL</span>
  </div>
  <div class="max-w-6xl mx-auto px-5 pb-4 flex gap-2">
    <button onclick="showTab('dash')" id="b-dash" class="bg-white text-black px-4 py-2 rounded-full text-sm font-semibold">Dashboard</button>
    <button onclick="showTab('in')" id="b-in" class="bg-white/20 px-4 py-2 rounded-full text-sm">Items Masuk</button>
    <button onclick="showTab('out')" id="b-out" class="bg-white/20 px-4 py-2 rounded-full text-sm">Items Keluar</button>
    <button onclick="showTab('hist')" id="b-hist" class="bg-white/20 px-4 py-2 rounded-full text-sm">Riwayat</button>
  </div>
</div>

<div class="max-w-6xl mx-auto p-5">
  <!-- DASHBOARD -->
  <div id="tab-dash">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="bg-white p-4 rounded-xl border"><div class="text-[10px] text-gray-500">TOTAL BALANCE</div><div id="k-total" class="text-2xl font-bold">0</div></div>
      <div class="bg-white p-4 rounded-xl border"><div class="text-[10px] text-gray-500">IN HARI INI</div><div id="k-in" class="text-2xl font-bold text-emerald-600">0</div></div>
      <div class="bg-white p-4 rounded-xl border"><div class="text-[10px] text-gray-500">OUT HARI INI</div><div id="k-out" class="text-2xl font-bold text-amber-600">0</div></div>
      <div class="bg-white p-4 rounded-xl border"><div class="text-[10px] text-gray-500">LOW STOCK</div><div id="k-low" class="text-2xl font-bold text-red-600">0</div></div>
    </div>
    <div class="bg-white p-4 rounded-xl border mb-5"><canvas id="c-out" height="100"></canvas></div>
    <div class="bg-white p-4 rounded-xl border"><h3 class="font-bold mb-3 text-sm">Stok Aktual di Store</h3><div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-2"></div></div>
  </div>

  <!-- IN -->
  <div id="tab-in" class="hidden max-w-xl">
    <h2 class="text-xl font-bold">Items Masuk</h2><p class="text-sm text-gray-500 mb-4">Dari laundry / supplier</p>
    <div class="bg-white p-6 rounded-xl border">
      <label class="text-xs font-bold">INPUT BY *</label><input id="in-by" class="w-full mt-1 mb-3 bg-[#f8f7f4] border rounded-lg p-3 text-sm" placeholder="Nama staff">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-bold">ITEMS IN *</label><select id="in-item" class="w-full mt-1 bg-[#f8f7f4] border rounded-lg p-3 text-sm"></select></div>
        <div><label class="text-xs font-bold">QTY *</label><input id="in-qty" type="number" min="1" class="w-full mt-1 bg-[#f8f7f4] border rounded-lg p-3 text-sm" placeholder="25"></div>
      </div>
      <button onclick="doIn()" class="w-full mt-5 bg-slate-900 text-white py-3 rounded-xl text-sm font-bold">Simpan Items IN</button>
    </div>
  </div>

  <!-- OUT -->
  <div id="tab-out" class="hidden max-w-xl">
    <h2 class="text-xl font-bold">Items Keluar</h2><p class="text-sm text-gray-500 mb-4">Ke room / laundry / discard</p>
    <div class="bg-white p-6 rounded-xl border">
      <label class="text-xs font-bold">INPUT BY *</label><input id="out-by" class="w-full mt-1 mb-3 bg-[#f8f7f4] border rounded-lg p-3 text-sm" placeholder="Nama staff">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-bold">ITEMS OUT *</label><select id="out-item" onchange="updStock()" class="w-full mt-1 bg-[#f8f7f4] border rounded-lg p-3 text-sm"></select><div id="stok-txt" class="text-[11px] mt-1 text-gray-500">Stok: 0 pcs</div></div>
        <div><label class="text-xs font-bold">QTY *</label><input id="out-qty" type="number" min="1" class="w-full mt-1 bg-[#f8f7f4] border rounded-lg p-3 text-sm" placeholder="10"></div>
      </div>
      <button onclick="doOut()" class="w-full mt-5 bg-amber-500 text-white py-3 rounded-xl text-sm font-bold">Catat Items OUT</button>
    </div>
  </div>

  <!-- HIST -->
  <div id="tab-hist" class="hidden">
    <h2 class="text-xl font-bold mb-3">Riwayat</h2>
    <div class="bg-white rounded-xl border overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-100 text-[10px]"><tr><th class="p-2 text-left">Waktu</th><th class="p-2">Type</th><th class="p-2 text-left">Item</th><th class="p-2">Qty</th><th class="p-2 text-left">By</th></tr></thead><tbody id="hist-body"></tbody></table></div>
  </div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-xs px-4 py-2 rounded-full opacity-0 transition">OK</div>

<script>
const ITEMS=["Bath towel","Hand Towel","Bath mat","Bathrobe","Face Towel","Oshibori","King Duvet Cover","Twin Duvet Cover","King Sheet","Twin Sheet","Pillow case","Pillow protector","Toiletries mat","Fruit napkin","Turndown mat"];
let data=JSON.parse(localStorage.getItem('linen_v3')||'[]');
let chart=null;

function init(){
  const opt=ITEMS.map(i=>`<option value="${i}">${i}</option>`).join('');
  document.getElementById('in-item').innerHTML=opt;
  document.getElementById('out-item').innerHTML=opt;
  refresh();
  updStock();
  const hasUrl = GOOGLE_SHEET_WEBAPP_URL && GOOGLE_SHEET_WEBAPP_URL.includes('https://');
  document.getElementById('badge').innerText = hasUrl ? 'SYNC ON' : 'LOCAL';
  document.getElementById('badge').className = hasUrl ? 'text-[10px] bg-emerald-500 px-3 py-1 rounded-full' : 'text-[10px] bg-white/20 px-3 py-1 rounded-full';
}
function balMap(){ const m={}; ITEMS.forEach(i=>m[i]=0); data.forEach(t=>{ m[t.item]+= t.type==='IN'?t.qty:-t.qty }); return m; }
function showTab(id){
  ['dash','in','out','hist'].forEach(k=>{
    document.getElementById('tab-'+k).classList.toggle('hidden',k!==id);
    document.getElementById('b-'+k).className = k===id ? 'bg-white text-black px-4 py-2 rounded-full text-sm font-semibold' : 'bg-white/20 px-4 py-2 rounded-full text-sm';
  });
  if(id==='dash') drawChart();
  if(id==='hist') renderHist();
  if(id==='out') updStock();
}
function refresh(){
  const b=balMap();
  document.getElementById('k-total').innerText=Object.values(b).reduce((a,c)=>a+c,0);
  const today=new Date().toDateString();
  document.getElementById('k-in').innerText=data.filter(x=>x.type==='IN'&&new Date(x.timestamp).toDateString()===today).reduce((a,c)=>a+c.qty,0);
  document.getElementById('k-out').innerText=data.filter(x=>x.type==='OUT'&&new Date(x.timestamp).toDateString()===today).reduce((a,c)=>a+c.qty,0);
  document.getElementById('k-low').innerText=Object.values(b).filter(v=>v<20).length;
  document.getElementById('grid').innerHTML=Object.entries(b).map(([k,v])=>{
    let cls='bg-emerald-50 border-emerald-200'; if(v<20) cls='bg-red-50 border-red-200'; else if(v<50) cls='bg-amber-50 border-amber-200';
    return `<div class="border rounded-lg p-3 ${cls}"><div class="text-[10px]">${k}</div><div class="font-bold text-lg">${v}</div><div class="text-[10px]">pcs</div></div>`;
  }).join('');
  drawChart();
}
function drawChart(){
  const ctx=document.getElementById('c-out'); if(!ctx) return; if(chart) chart.destroy();
  const days=[...Array(7)].map((_,i)=>{let d=new Date(); d.setDate(d.getDate()-(6-i)); return d;});
  const vals=days.map(d=>data.filter(t=>t.type==='OUT'&&new Date(t.timestamp).toDateString()===d.toDateString()).reduce((a,c)=>a+c.qty,0));
  chart=new Chart(ctx,{type:'bar',data:{labels:days.map(d=>d.toLocaleDateString('id-ID',{weekday:'short'})),datasets:[{data:vals,backgroundColor:'#f59e0b'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}
function doIn(){
  const by=document.getElementById('in-by').value.trim(); const item=document.getElementById('in-item').value; const qty=parseInt(document.getElementById('in-qty').value);
  if(!by||!qty){ toast('Lengkapi data'); return; }
  const row={id:Date.now().toString(),type:'IN',inputBy:by,item,qty,timestamp:new Date().toISOString()};
  data.push(row); localStorage.setItem('linen_v3',JSON.stringify(data)); sendSheet(row);
  toast('IN disimpan'); document.getElementById('in-by').value=''; document.getElementById('in-qty').value=''; refresh();
}
function doOut(){
  const by=document.getElementById('out-by').value.trim(); const item=document.getElementById('out-item').value; const qty=parseInt(document.getElementById('out-qty').value);
  if(!by||!qty){ toast('Lengkapi data'); return; }
  const b=balMap(); if((b[item]||0)<qty){ toast('Stok kurang, sisa '+ (b[item]||0)); return; }
  const row={id:Date.now().toString(),type:'OUT',inputBy:by,item,qty,timestamp:new Date().toISOString()};
  data.push(row); localStorage.setItem('linen_v3',JSON.stringify(data)); sendSheet(row);
  toast('OUT dicatat'); document.getElementById('out-by').value=''; document.getElementById('out-qty').value=''; refresh(); updStock();
}
function updStock(){ const b=balMap(); const it=document.getElementById('out-item').value; document.getElementById('stok-txt').innerText='Stok: '+(b[it]||0)+' pcs'; }
function renderHist(){ document.getElementById('hist-body').innerHTML=[...data].reverse().map(t=>`<tr class="border-b"><td class="p-2 text-[11px]">${new Date(t.timestamp).toLocaleString('id-ID')}</td><td class="p-2 text-center"><span class="px-2 py-1 rounded-full text-[10px] ${t.type==='IN'?'bg-emerald-100':'bg-amber-100'}">${t.type}</span></td><td class="p-2">${t.item}</td><td class="p-2 text-center font-bold">${t.qty}</td><td class="p-2">${t.inputBy}</td></tr>`).join('') || '<tr><td colspan=5 class="p-4 text-center text-gray-400">Kosong</td></tr>'; }
function toast(m){ const t=document.getElementById('toast'); t.innerText=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2000); }
function sendSheet(row){
  if(!GOOGLE_SHEET_WEBAPP_URL || !GOOGLE_SHEET_WEBAPP_URL.startsWith('https://')) return;
  fetch(GOOGLE_SHEET_WEBAPP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(row)}).then(()=>console.log('sent to sheet')).catch(e=>console.log('sheet err',e));
}
init();
</script>
</body>
</html>
